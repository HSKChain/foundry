[test-groups]

[profile.default]
retries = { backoff = "exponential", count = 2, delay = "5s", jitter = true }
slow-timeout = { period = "30s", terminate-after = 3 }
# Exclude flaky tests from regular CI runs - they run in nightly test-flaky workflow
default-filter = "not test(/flaky_/)"

[[profile.default.overrides]]
filter = "test(/ext_integration/)"
slow-timeout = { period = "5m", terminate-after = 4 }

# The out-of-gas script tests spin an infinite loop against the default ~1B gas
# limit; under full parallel suite load they can exceed the default timeout.
[[profile.default.overrides]]
filter = "test(assert_exit_code_error_on_out_of_gas_script)"
slow-timeout = { period = "60s", terminate-after = 4 }

# The all-features suite additionally enables `isolate-by-default` and heavy
# optional features (js-tracer, tracy-allocator); invariant/fuzz runs are
# CPU-bound and can exceed the default timeout under full parallel load.
[[profile.default.overrides]]
filter = "test(/invariant/) or test(/fuzz/) or test(can_generate_solmate_docs) or test(testdata)"
slow-timeout = { period = "2m", terminate-after = 4 }

# Chisel REPL sessions interact over a pty with per-expect timeouts; under full
# parallel load the whole session can exceed the default timeout.
[[profile.default.overrides]]
filter = "package(chisel) & test(/repl/)"
slow-timeout = { period = "60s", terminate-after = 4 }

# Do not re-run so that `cargo cheats` is ran locally.
[[profile.default.overrides]]
filter = "package(foundry-cheatcodes-spec)"
retries = 0

# Profile for running flaky tests (used by nightly CI and for local debugging)
# Run with: cargo nextest run --profile flaky
[profile.flaky]
default-filter = "test(/flaky_/)"
retries = { backoff = "exponential", count = 5, delay = "10s", jitter = true }
slow-timeout = { period = "60s", terminate-after = 3 }
